# 6시간마다 블로그·GitHub 데이터를 갱신하고 GitHub Pages에 배포합니다.
# 저장소 Settings → Pages → Source를 "GitHub Actions"로 설정해야 합니다.
name: 데이터 갱신 및 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 블로그·GitHub 데이터 가져오기
        run: node scripts/update-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 바뀐 data.json 커밋
        run: |
          if ! git diff --quiet data.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "chore: 데이터 자동 갱신"
            git push
          fi

      - uses: actions/configure-pages@v5

      - name: 배포할 파일 모으기
        run: mkdir _site && cp index.html data.json _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
